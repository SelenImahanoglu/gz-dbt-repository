version: 2

sources:
  - name: gz_raw_data
    schema: gz_raw_data
    tables:
      - name: raw_gz_adwords
        description: "Google Adwords reklam verisi"
      - name: raw_gz_bing
        description: "Bing reklam verisi"
      - name: raw_gz_criteo
        description: "Criteo reklam verisi"
      - name: raw_gz_facebook
        description: "Facebook reklam verisi"
      - name: raw_gz_sales
      - name: raw_gz_product
      - name: raw_gz_ship

models:
  - name: stg_gz_raw_data__raw_gz_product
    columns:
      - name: products_id
        tests:
          - unique
          - not_null
      - name: purchase_price
        tests:
          - not_null

  - name: stg_gz_raw_data__raw_gz_sales
    columns:
      - name: date_date
      - name: orders_id
        tests:
          - not_null
      - name: products_id
        tests:
          - not_null
      - name: revenue
      - name: quantity

  - name: stg_gz_raw_data__raw_gz_ship
    columns:
      - name: orders_id
        tests:
          - unique
          - not_null
      - name: shipping_fee
      - name: logistic_cost
      - name: ship_cost

  - name: int_campaigns
    description: "Farklı kampanya kaynaklarını birleştiren ara model"
    columns:
      - name: campaign_id
        description: "Her kampanyayı benzersiz olarak tanımlayan ID"
        tests:
          - unique
          - not_null

      - name: campaign_name
        description: "Kampanyanın adı"
        tests:
          - not_null

      - name: channel
        description: "Kampanyanın yürütüldüğü kanal (ör. Email, Social, Paid Search)"
        tests:
          - accepted_values:
              values: ['Email', 'Social', 'Paid Search', 'Organic']

      - name: start_date
        description: "Kampanyanın başlangıç tarihi"
        tests:
          - not_null

      - name: end_date
        description: "Kampanyanın bitiş tarihi"

      - name: total_spend
        description: "Kampanyaya harcanan toplam bütçe"
        tests:
          - not_null

      - name: clicks
        description: "Kampanyadan gelen toplam tıklama sayısı"

      - name: impressions
        description: "Kampanyanın gösterim sayısı"
  - name: int_campaigns_day
    description: "Her gün için kampanya performansının özetini içeren model."
    columns:
      - name: date_date
        description: "Kampanya verisinin ait olduğu tarih."
        tests:
          - not_null

      - name: campaign_id
        description: "Kampanyayı benzersiz şekilde tanımlayan ID."
        tests:
          - unique
          - not_null

      - name: campaign_name
        description: "Kampanyanın adı."
        tests:
          - not_null

      - name: channel
        description: "Kampanyanın yürütüldüğü kanal (örneğin Email, Social, Paid Search)."
        tests:
          - accepted_values:
              values: ['Email', 'Social', 'Paid Search', 'Organic']

      - name: total_clicks
        description: "Kampanyadan gelen toplam tıklama sayısı."
        tests:
          - not_null

      - name: total_impressions
        description: "Kampanyanın toplam gösterim sayısı."
        tests:
          - not_null

      - name: total_spend
        description: "Kampanya için yapılan toplam harcama."
        tests:
          - not_null

      - name: ctr
        description: "Click-through rate: Tıklama oranı."

      - name: cpc
        description: "Cost per click: Tıklama başına maliyet."

      - name: cpm
        description: "Cost per mille: 1000 gösterim başına maliyet."    