sources:
  - name: gz_raw_data
    schema: gz_raw_data
    tables:
      - name: raw_gz_sales
      - name: raw_gz_product
      - name: raw_gz_ship

models:
  - name: stg_gz_raw_data__raw_gz_product
    columns:
      - name: products_id
        tests:
          - unique
          - not_null
      - name: purchase_price
        tests:
          - not_null

  - name: stg_gz_raw_data__raw_gz_sales
    columns:
      - name: date_date
      - name: orders_id
        tests:
          - not_null
      - name: products_id
        tests:
          - not_null
      - name: revenue
      - name: quantity

  - name: stg_gz_raw_data__raw_gz_ship
    columns:
      - name: orders_id
        tests:
          - unique
          - not_null
      - name: shipping_fee
      - name: logistic_cost
      - name: ship_cost