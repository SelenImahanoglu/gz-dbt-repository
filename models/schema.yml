version: 2

sources:
  - name: gz_raw_data
    schema: gz_raw_data
    tables:
      - name: raw_gz_adwords
        description: "Google Adwords reklam verisi"
      - name: raw_gz_bing
        description: "Bing reklam verisi"
      - name: raw_gz_criteo
        description: "Criteo reklam verisi"
      - name: raw_gz_facebook
        description: "Facebook reklam verisi"
      - name: raw_gz_sales
      - name: raw_gz_product
      - name: raw_gz_ship

models:
  - name: stg_gz_raw_data__raw_gz_product
    description: "Ürün ham verisini düzenleyen model."
    columns:
      - name: products_id
        tests:
          - unique
          - not_null
      - name: purchase_price
        tests:
          - not_null

  - name: stg_gz_raw_data__raw_gz_sales
    description: "Satış ham verisini düzenleyen model."
    columns:
      - name: date_date
        description: "Satış tarihi."
      - name: orders_id
        tests:
          - not_null
      - name: products_id
        tests:
          - not_null
      - name: revenue
        description: "Satıştan elde edilen gelir."
      - name: quantity
        description: "Satılan ürün adedi."

  - name: stg_gz_raw_data__raw_gz_ship
    description: "Kargo ve lojistik ham verisini düzenleyen model."
    columns:
      - name: orders_id
        tests:
          - unique
          - not_null
      - name: shipping_fee
        description: "Kargo ücreti."
      - name: logistic_cost
        description: "Lojistik maliyeti."
      - name: ship_cost
        description: "Gönderim maliyeti."

 
  - name: int_campaigns_day
    description: "Her gün için kampanya performansının özetini içeren model."
    columns:
      - name: date_date
        description: "Kampanya verisinin ait olduğu tarih."
        tests:
          - not_null

      - name: campaign_key
        description: "Kampanyayı benzersiz şekilde tanımlayan anahtar."
        tests:
          - not_null

      - name: campaign_name
        description: "Kampanyanın adı."
        tests:
          - not_null

      - name: paid_source
        description: "Kampanyanın kaynağı (ör. Adwords, Bing, Criteo, Facebook)."
        tests:
          - accepted_values:
              values: ['Adwords', 'Bing', 'Criteo', 'Facebook']

      - name: total_clicks
        description: "Toplam tıklama sayısı."
      - name: total_impressions
        description: "Toplam gösterim sayısı."
      - name: total_spend
        description: "Toplam reklam harcaması."
      - name: ctr
        description: "Click-through rate: Tıklama oranı."
      - name: cpc
        description: "Cost per click: Tıklama başına maliyet."
      - name: cpm
        description: "Cost per mille: 1000 gösterim başına maliyet."

  - name: finance_campaigns_day
    description: "Finance_days ve int_campaigns_day modellerinin birleşimi. Finans ekibinin günlük kampanya kârlılığını izleyebilmesi için gelir, maliyet ve reklam metriklerini tek tabloda birleştirir."
    columns:
      - name: date
        description: "Günlük tarih bilgisi."
        tests:
          - not_null

      - name: ads_margin
        description: "Operasyonel marjdan reklam maliyeti çıkarılarak hesaplanan gerçek kârlılık (NULL değerler 0 olarak işlenmiştir)."
        tests:
          - not_null

      - name: average_basket
        description: "Ortalama sepet tutarı."
        tests:
          - not_null

      - name: operational_margin
        description: "Günlük operasyonel marj."
        tests:
          - not_null

      - name: ads_cost
        description: "Toplam reklam harcaması (kampanyasız günlerde 0)."

      - name: ads_impression
        description: "Toplam günlük gösterim (kampanyasız günlerde 0)."

      - name: ads_clicks
        description: "Toplam günlük tıklama (kampanyasız günlerde 0)."

      - name: quantity
        description: "Toplam satılan ürün adedi."
        tests:
          - not_null

      - name: revenue
        description: "Toplam gelir."
        tests:
          - not_null

      - name: purchase_cost
        description: "Toplam satın alma maliyeti."
        tests:
          - not_null

      - name: margin
        description: "Toplam marj (total_operational_margin ile eşit)."
        tests:
          - not_null

      - name: shipping_fee
        description: "Toplam kargo ücretleri."
        tests:
          - not_null

      - name: log_cost
        description: "Toplam lojistik maliyetleri."
        tests:
          - not_null

  - name: int_campaigns
    description: "Farklı kampanya kaynaklarını birleştiren ara model."
    columns:
      - name: campaign_key
        description: "Kampanya anahtarı (farklı kaynaklarda tekrar edebilir)."
        tests:
          - not_null   # unique testi kaldırıldı çünkü tekrarlar normal
      - name: paid_source
        description: "Veri kaynağı (Adwords, Bing, Criteo, Facebook)."
        tests:
          - accepted_values:
              values: ['Adwords', 'Bing', 'Criteo', 'Facebook']
      - name: ads_cost
        description: "Kampanyanın harcaması (float64)."
        tests:
          - not_null
      - name: impression
        description: "Kampanyanın gösterim sayısı."
      - name: click
        description: "Kampanyadan gelen tıklama sayısı."